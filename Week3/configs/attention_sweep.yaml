program: train.py
project: "C5-ImageCaptioning-sweep-full"
method: grid
metric:
  name: best_METEOR
  goal: maximize

parameters:
  encoder:
    value: "clip-vit-b32"
  decoder_type:
    value: "lstm"
  decoder_dim:
    value: 1024
  decoder_layers:
    value: 3
  embed_dim:
    value: 1024
  lr:
    value: 0.0005
  optimizer:
    value: "adam"
  scheduler:
    value: "cosine"
  generation_method:
    value: "beam"
  beam_size:
    value: 3
  mode:
    value: "full"
  epochs:
    value: 10
  batch_size:
    value: 128
  num_workers:
    value: 4
  output_dir:
    value: "results/full_sweep"
  freeze_encoder:
    value: true
  attn_type:
    value: "adaptive"
  attn_dim:
    value: 256
  text_level:
    value: "word"

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
