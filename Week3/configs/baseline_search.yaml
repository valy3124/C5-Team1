program: train.py
project: "C5-ImageCaptioning"
method: grid
metric:
  name: METEOR
  goal: maximize
parameters:
  encoder:
    value: "resnet18"
  mode:
    value: "search"
  epochs:
    value: 6
  batch_size:
    values: [8]
  lr:
    values: [1e-4, 3e-4, 1e-3]
  num_workers:
    value: 4
  output_dir:
    value: "results/checkpoints"
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
