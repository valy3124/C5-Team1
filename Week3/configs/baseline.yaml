program: train.py
project: "C5-ImageCaptioning"
method: grid
metric:
  name: METEOR
  goal: maximize
parameters:
  encoder:
    values: ["resnet18"]
  mode:
    value: "search"
  epochs:
    value: 5
  batch_size:
    value: 32
  lr:
    value: 1e-3
  num_workers:
    value: 4
  output_dir:
    value: "results/checkpoints"
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
